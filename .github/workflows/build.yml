name: Build
on:
  workflow_dispatch:
    inputs:
      version_name: { description: "Version name", required: true, default: "0.1.0" }
      code: { description: "Version code", required: true, default: "1" }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env: { KS: "${{ secrets.VL_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/vl.jks; echo "VL_STORE_FILE=$RUNNER_TEMP/vl.jks" >> $GITHUB_ENV; fi
      - name: Build
        env:
          VL_STORE_PASSWORD: ${{ secrets.VL_STORE_PASSWORD }}
          VL_KEY_ALIAS: ${{ secrets.VL_KEY_ALIAS }}
          VL_KEY_PASSWORD: ${{ secrets.VL_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
        run: ./gradlew --no-daemon :app:assembleRelease -PvlName=${{ inputs.version_name }} -PvlCode=${{ inputs.code }}
      - name: Release (Actions artifact storage is full on this account)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T=v${{ inputs.version_name }}-${{ inputs.code }}
          gh release delete "$T" -y --cleanup-tag 2>/dev/null || true
          gh release create "$T" app/build/outputs/apk/release/*.apk --target "$GITHUB_SHA" --title "$T" --notes "CI build"
