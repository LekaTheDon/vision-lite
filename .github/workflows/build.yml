name: Build
on:
  workflow_dispatch:
    inputs:
      version_name: { description: "Version name", required: true, default: "0.1.0" }
      code: { description: "Version code", required: true, default: "1" }
      lab: { description: "Lab app (separate, Vision Lab)", required: false, default: "0" }
      dev: { description: "Owner build (root helpers, source-health notices); 0 = shared build", required: false, default: "0" }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Dolby Vision rewriter (native/vldovi, Rust)
        if: hashFiles('native/vldovi/Cargo.toml') != ''
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target aarch64-linux-android,armv7-linux-androideabi
          cargo +1.88.0 install cargo-ndk --version 3.5.4 --locked
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          [ -d "$ANDROID_NDK_HOME" ] || yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
          cd native/vldovi
          cargo +1.88.0 ndk -t arm64-v8a -t armeabi-v7a build --release
          for p in "arm64-v8a aarch64-linux-android" "armeabi-v7a armv7-linux-androideabi"; do set -- $p
            mkdir -p out/$1 && cp target/$2/release/libvldovi.a out/$1/ && ls -la out/$1; done
      - name: Signing key
        env: { KS: "${{ secrets.VL_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/vl.jks; echo "VL_STORE_FILE=$RUNNER_TEMP/vl.jks" >> $GITHUB_ENV; fi
      - name: Build
        env:
          VL_STORE_PASSWORD: ${{ secrets.VL_STORE_PASSWORD }}
          VL_KEY_ALIAS: ${{ secrets.VL_KEY_ALIAS }}
          VL_KEY_PASSWORD: ${{ secrets.VL_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          NUVIO_KEY: ${{ secrets.NUVIO_KEY }}
          META_URL: ${{ secrets.META_URL }}
          META_KEY: ${{ secrets.META_KEY }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: ./gradlew --no-daemon :app:assembleRelease -PvlName=${{ inputs.version_name }} -PvlCode=${{ inputs.code }} -PvlLab=${{ inputs.lab }} -PvlDev=${{ inputs.dev }}
      - name: Release (Actions artifact storage is full on this account)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T=v${{ inputs.version_name }}-${{ inputs.code }}${{ inputs.lab == '1' && '-lab' || '' }}
          gh release delete "$T" -y --cleanup-tag 2>/dev/null || true
          gh release create "$T" app/build/outputs/apk/release/*.apk --target "$GITHUB_SHA" --title "$T" --notes "CI build"
