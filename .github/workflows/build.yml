name: Build
on:
  workflow_dispatch:
    inputs:
      version_name: { description: "Version name", required: true, default: "0.1.0" }
      code: { description: "Version code", required: true, default: "1" }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env: { KS: "${{ secrets.VL_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/vl.jks; echo "VL_STORE_FILE=$RUNNER_TEMP/vl.jks" >> $GITHUB_ENV; fi
      - name: Build
        env:
          VL_STORE_PASSWORD: ${{ secrets.VL_STORE_PASSWORD }}
          VL_KEY_ALIAS: ${{ secrets.VL_KEY_ALIAS }}
          VL_KEY_PASSWORD: ${{ secrets.VL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease -PvlName=${{ inputs.version_name }} -PvlCode=${{ inputs.code }}
      - uses: actions/upload-artifact@v4
        with: { name: "${{ inputs.version_name }}", path: app/build/outputs/apk/release/*.apk }
